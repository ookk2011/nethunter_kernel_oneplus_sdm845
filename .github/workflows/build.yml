name: Build NetHunter Kernel (A15 - fajita)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex git \
        libssl-dev libncurses5-dev libncursesw5-dev python3 unzip zip

    - name: Download AOSP Clang
      run: |
        mkdir -p ~/clang
        cd ~/clang
        curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r522817.tar.gz
        tar -xzf clang-r522817.tar.gz

    - name: Build kernel using NetHunter builder
      run: |
        export PATH=~/clang/bin:$PATH
        cd kali-nethunter-kernel-builder
        chmod +x build.sh
        ./build.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-A15-fajita
        path: kali-nethunter-kernel-builder/output/*.zip
